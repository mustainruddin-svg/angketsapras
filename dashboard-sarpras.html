<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard Evaluasi Tim Sarpras — SMPIT/SMAIT Ar-Rahmah</title>
<style>
  :root{
    --primary:#3B9CE8;
    --primary-dark:#1A73B8;
    --primary-light:#EAF4FD;
    --gold:#C9A227;
    --white:#FFFFFF;
    --text:#1F2937;
    --text-soft:#5B6472;
    --border:#E1E8F0;
    --danger:#E05252;
    --good:#1A8B4E;
    --warn:#D98A17;
    --radius:14px;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
    background:#F4F8FC;
    color:var(--text);
  }
  /* ===== PIN GATE ===== */
  #pinGate{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;
    background:linear-gradient(135deg,var(--primary) 0%,var(--primary-dark) 100%);
  }
  .pin-card{
    background:var(--white);
    border-radius:var(--radius);
    padding:32px 26px;
    max-width:360px;
    width:100%;
    text-align:center;
    box-shadow:0 12px 30px rgba(0,0,0,0.2);
  }
  .pin-card .badge{
    display:inline-block;
    background:var(--gold);
    color:#3A2E00;
    font-size:11px;
    font-weight:700;
    padding:4px 12px;
    border-radius:999px;
    margin-bottom:12px;
  }
  .pin-card h2{margin:0 0 6px;font-size:17px;color:var(--primary-dark);}
  .pin-card p{margin:0 0 18px;font-size:12.5px;color:var(--text-soft);}
  .pin-card input{
    width:100%;
    padding:13px;
    font-size:20px;
    text-align:center;
    letter-spacing:6px;
    border:1.5px solid var(--border);
    border-radius:10px;
    margin-bottom:12px;
  }
  .pin-card button{
    width:100%;
    background:linear-gradient(135deg,var(--primary) 0%,var(--primary-dark) 100%);
    color:var(--white);
    border:none;
    padding:13px;
    border-radius:10px;
    font-size:14px;
    font-weight:700;
    cursor:pointer;
  }
  .pin-error{color:var(--danger);font-size:12.5px;margin-top:8px;min-height:16px;}

  /* ===== DASHBOARD ===== */
  #dashboard{display:none;}
  header{
    background:linear-gradient(135deg,var(--primary) 0%,var(--primary-dark) 100%);
    color:var(--white);
    padding:22px 20px 26px;
    text-align:center;
  }
  header .badge{
    display:inline-block;background:var(--gold);color:#3A2E00;
    font-size:11px;font-weight:700;padding:4px 12px;border-radius:999px;margin-bottom:8px;
  }
  header h1{margin:4px 0;font-size:19px;}
  header p{margin:0;font-size:12.5px;opacity:.9;}

  .container{max-width:900px;margin:-16px auto 40px;padding:0 16px;}

  .stat-row{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(140px,1fr));
    gap:12px;
    margin-bottom:18px;
  }
  .stat-card{
    background:var(--white);
    border-radius:var(--radius);
    padding:16px;
    text-align:center;
    box-shadow:0 4px 14px rgba(31,41,55,0.06);
    border:1px solid var(--border);
  }
  .stat-card .val{font-size:26px;font-weight:800;color:var(--primary-dark);}
  .stat-card .lbl{font-size:11.5px;color:var(--text-soft);margin-top:2px;}

  .card{
    background:var(--white);
    border-radius:var(--radius);
    padding:18px;
    margin-bottom:16px;
    box-shadow:0 4px 14px rgba(31,41,55,0.06);
    border:1px solid var(--border);
  }
  .card h3{
    margin:0 0 14px;
    font-size:15px;
    color:var(--primary-dark);
    display:flex;align-items:center;gap:8px;
  }
  .card h3 .dot{width:8px;height:8px;border-radius:50%;background:var(--gold);}

  .bar-row{margin-bottom:12px;}
  .bar-row:last-child{margin-bottom:0;}
  .bar-label{
    display:flex;justify-content:space-between;
    font-size:12.5px;font-weight:600;margin-bottom:5px;
  }
  .bar-label .score{color:var(--primary-dark);font-weight:800;}
  .bar-track{
    background:var(--primary-light);
    border-radius:8px;
    height:12px;
    overflow:hidden;
  }
  .bar-fill{
    height:100%;
    border-radius:8px;
    background:linear-gradient(90deg,var(--primary),var(--primary-dark));
    transition:width .6s ease;
  }
  .bar-fill.warn{background:linear-gradient(90deg,#F0B94D,var(--warn));}
  .bar-fill.danger{background:linear-gradient(90deg,#EF8A8A,var(--danger));}

  .item-detail{
    margin-top:10px;
    padding-top:10px;
    border-top:1px dashed var(--border);
    font-size:11.5px;
    color:var(--text-soft);
  }
  .item-detail-row{
    display:flex;justify-content:space-between;
    padding:3px 0;
  }

  .tag-cloud{display:flex;flex-wrap:wrap;gap:8px;}
  .tag{
    background:var(--primary-light);
    color:var(--primary-dark);
    padding:6px 12px;
    border-radius:999px;
    font-size:12px;
    font-weight:600;
  }
  .tag .count{
    background:var(--primary-dark);
    color:var(--white);
    border-radius:999px;
    padding:1px 7px;
    margin-left:6px;
    font-size:10.5px;
  }

  .feedback-item{
    padding:12px 0;
    border-bottom:1px solid var(--border);
  }
  .feedback-item:last-child{border-bottom:none;}
  .feedback-meta{
    font-size:11px;color:var(--text-soft);margin-bottom:4px;
    display:flex;gap:8px;flex-wrap:wrap;
  }
  .feedback-meta span{
    background:var(--primary-light);
    color:var(--primary-dark);
    padding:2px 8px;border-radius:999px;font-weight:600;
  }
  .feedback-text{font-size:13px;line-height:1.55;}
  .feedback-text b{color:var(--text);}

  .empty-state{
    text-align:center;padding:30px 10px;color:var(--text-soft);font-size:13px;
  }
  .refresh-btn{
    display:block;
    margin:6px auto 20px;
    background:var(--white);
    border:1.5px solid var(--primary);
    color:var(--primary-dark);
    padding:9px 18px;
    border-radius:999px;
    font-size:12.5px;
    font-weight:700;
    cursor:pointer;
  }
  .loading{text-align:center;padding:40px;color:var(--text-soft);font-size:13.5px;}
</style>
</head>
<body>

<!-- ===== GERBANG PIN ===== -->
<div id="pinGate">
  <div class="pin-card">
    <div class="badge">YAYASAN AR-RAHMAH SULAWESI</div>
    <h2>Dashboard Evaluasi Sarpras</h2>
    <p>Khusus pimpinan yayasan. Masukkan PIN untuk melihat hasil evaluasi kinerja Tim Sarana &amp; Prasarana SMPIT/SMAIT.</p>
    <input type="password" id="pinInput" inputmode="numeric" maxlength="6" placeholder="••••">
    <button id="btnPin">Buka Dashboard</button>
    <div class="pin-error" id="pinError"></div>
  </div>
</div>

<!-- ===== DASHBOARD ===== -->
<div id="dashboard">
  <header>
    <div class="badge">YAYASAN AR-RAHMAH SULAWESI</div>
    <h1>Dashboard Evaluasi Kinerja Tim Sarpras</h1>
    <p>Unit SMPIT &amp; SMAIT Ar-Rahmah Makassar</p>
  </header>

  <div class="container">
    <button class="refresh-btn" id="btnRefresh">⟳ Muat Ulang Data</button>

    <div id="content" class="loading">Memuat data...</div>
  </div>
</div>

<script>
// ==== GANTI DENGAN URL WEB APP APPS SCRIPT SETELAH DEPLOY ====
const API_URL = "GANTI_DENGAN_URL_WEBAPP_APPS_SCRIPT";

let currentPin = "";

document.getElementById("btnPin").addEventListener("click", tryUnlock);
document.getElementById("pinInput").addEventListener("keydown", e => { if (e.key === "Enter") tryUnlock(); });
document.getElementById("btnRefresh").addEventListener("click", () => loadData(currentPin));

async function tryUnlock(){
  const pin = document.getElementById("pinInput").value.trim();
  const errEl = document.getElementById("pinError");
  errEl.textContent = "";

  if (!pin) { errEl.textContent = "Masukkan PIN terlebih dahulu."; return; }
  if (API_URL.indexOf("GANTI_DENGAN") !== -1) { errEl.textContent = "URL backend belum diatur. Hubungi admin sistem."; return; }

  document.getElementById("btnPin").textContent = "Memeriksa...";
  const ok = await loadData(pin);
  document.getElementById("btnPin").textContent = "Buka Dashboard";

  if (ok) {
    currentPin = pin;
    document.getElementById("pinGate").style.display = "none";
    document.getElementById("dashboard").style.display = "block";
  } else {
    errEl.textContent = "PIN salah atau gagal memuat data.";
  }
}

async function loadData(pin){
  const content = document.getElementById("content");
  content.className = "loading";
  content.textContent = "Memuat data...";

  try {
    const res = await fetch(`${API_URL}?action=getDashboardData&pin=${encodeURIComponent(pin)}`);
    const data = await res.json();

    if (data.status !== "ok") {
      if (document.getElementById("dashboard").style.display === "block") {
        content.className = "empty-state";
        content.textContent = "Gagal memuat data: " + (data.message || "PIN salah.");
      }
      return false;
    }

    renderDashboard(data);
    return true;
  } catch (err) {
    content.className = "empty-state";
    content.textContent = "Gagal terhubung ke server: " + err.message;
    return false;
  }
}

function scoreClass(score){
  if (score >= 4) return "";
  if (score >= 3) return "warn";
  return "danger";
}

function renderDashboard(data){
  const content = document.getElementById("content");
  content.className = "";

  if (data.totalResponden === 0) {
    content.innerHTML = `<div class="card"><div class="empty-state">Belum ada jawaban masuk.</div></div>`;
    return;
  }

  let html = "";

  // Ringkasan angka
  html += `<div class="stat-row">
    <div class="stat-card"><div class="val">${data.totalResponden}</div><div class="lbl">Total Responden</div></div>
    <div class="stat-card"><div class="val">${data.overall}</div><div class="lbl">Skor Kepuasan Keseluruhan (dari 5)</div></div>
  </div>`;

  // Skor per dimensi
  html += `<div class="card"><h3><span class="dot"></span> Skor Rata-rata per Dimensi</h3>`;
  Object.keys(data.dimensi).forEach(dim => {
    const score = data.dimensi[dim];
    const pct = (score / 5) * 100;
    html += `
      <div class="bar-row">
        <div class="bar-label"><span>${dim}</span><span class="score">${score} / 5</span></div>
        <div class="bar-track"><div class="bar-fill ${scoreClass(score)}" style="width:${pct}%;"></div></div>
        <div class="item-detail">
          ${Object.entries(data.perDimensiItem[dim]).map(([label, val]) =>
            `<div class="item-detail-row"><span>${label}</span><span><b>${val}</b></span></div>`
          ).join("")}
        </div>
      </div>`;
  });
  html += `</div>`;

  // Perbandingan per unit
  if (data.perUnit && Object.keys(data.perUnit).length) {
    html += `<div class="card"><h3><span class="dot"></span> Perbandingan Skor Kepuasan per Unit</h3>`;
    Object.entries(data.perUnit).forEach(([unit, d]) => {
      const pct = (d.rataRata / 5) * 100;
      html += `
        <div class="bar-row">
          <div class="bar-label"><span>${unit} (${d.jumlah} responden)</span><span class="score">${d.rataRata} / 5</span></div>
          <div class="bar-track"><div class="bar-fill ${scoreClass(d.rataRata)}" style="width:${pct}%;"></div></div>
        </div>`;
    });
    html += `</div>`;
  }

  // Aspek paling perlu diperbaiki
  const tallyEntries = Object.entries(data.perbaikanTally).sort((a,b) => b[1]-a[1]);
  html += `<div class="card"><h3><span class="dot"></span> Aspek yang Paling Sering Disebut Perlu Diperbaiki</h3>`;
  if (tallyEntries.length) {
    html += `<div class="tag-cloud">`;
    tallyEntries.forEach(([label, count]) => {
      html += `<div class="tag">${label}<span class="count">${count}</span></div>`;
    });
    html += `</div>`;
  } else {
    html += `<div class="empty-state">Belum ada data.</div>`;
  }
  html += `</div>`;

  // Umpan balik terbuka
  html += `<div class="card"><h3><span class="dot"></span> Umpan Balik Terbuka dari Guru</h3>`;
  if (data.feedback.length) {
    data.feedback.forEach(f => {
      const tgl = f.timestamp ? new Date(f.timestamp).toLocaleDateString('id-ID', {day:'numeric',month:'long',year:'numeric'}) : '';
      html += `<div class="feedback-item">
        <div class="feedback-meta"><span>${f.unit || '-'}</span><span>${f.jabatan || '-'}</span><span>${tgl}</span></div>
        ${f.pengalaman ? `<div class="feedback-text"><b>Pengalaman:</b> ${escapeHtml(f.pengalaman)}</div>` : ""}
        ${f.saran ? `<div class="feedback-text" style="margin-top:4px;"><b>Saran:</b> ${escapeHtml(f.saran)}</div>` : ""}
      </div>`;
    });
  } else {
    html += `<div class="empty-state">Belum ada umpan balik tertulis.</div>`;
  }
  html += `</div>`;

  content.innerHTML = html;
}

function escapeHtml(str){
  const div = document.createElement("div");
  div.textContent = str;
  return div.innerHTML;
}
</script>

</body>
</html>
